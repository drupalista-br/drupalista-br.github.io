baseURL: https://escritorio.tec.br
defaultContentLanguage: pt-br
defaultContentLanguageInSubdir: false
locale: pt-BR
enableMissingTranslationPlaceholders: true
enableRobotsTXT: true
enableGitInfo: true
taxonomies:
  tag: tags
  category: categorias
pygmentsCodeFences: true
pygmentsUseClasses: false
pygmentsUseClassic: false
pygmentsStyle: tango
mediaTypes:
  text/redirects:
    delimiter: ''
outputFormats:
  redirects:
    baseName: _redirects
    isPlainText: true
    mediaType: text/redirects
    notAlternative: true
    root: true
permalinks:
  blog: /:section/:year/:month/:day/:slugorcontentbasename
imaging:
  resampleFilter: CatmullRom
services:
  googleAnalytics:
    id: G-GPTXR2V99M # drupalista.com.br@gmail.com
markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    style: tango # options at https://xyproto.github.io/splash/docs/all.html
    noClasses: false # Required for dark-mode support of code blocks

# Site Params
outputs:
  home: [HTML, markdown, print, RSS, redirects, LLMS]
  page: [HTML, markdown]
  section: [HTML, print, RSS, markdown]

params:
  taxonomy:
    taxonomyCloud: [tags, categorias]
    taxonomyCloudTitle: [Tag Cloud, categorias]
    taxonomyPageHeader: [tags, categorias]
  version_menu: Releases
  archived_version: false
  version: 0.18.0
  github_project_repo: https://github.com/google/docsy
  github_branch: main
  offlineSearch: true
  prism_syntax_highlighting: false
  copyright:
    from_year: 2020
  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_search_disable: true
    showLightDarkModeMenu: true
    readingtime:
      enable: false
  mainBranchPreviewURL: https://main--goldydocs.netlify.app/
  btn-lg: class="btn btn-lg btn-{1}" role="button"
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>
  links:
    developer:
      - name: Contato
        url: /contato
        icon: fa-brands fa-whatsapp
      - name: Suporte
        url: /suporte
        icon: fa fa-circle-info

security:
  funcs: # cspell:disable-line
    getenv: # cspell:disable-line
      # Netlify build env var
      - ^(BRANCH|BUILD_ID|COMMIT_REF|CONTEXT|DEPLOY_ID|NETLIFY|PULL_REQUEST|REVIEW_ID)$

module:
  hugoVersion:
    extended: true
    min: 0.160.1
  imports:
    - path: github.com/google/docsy/theme
      disable: false
  # works only folders and files that are part of the hugo ecosystem;
  # it won't work with docsy specific folder/files.
  mounts:
    - source: ../master/layouts
      target: layouts
    - source: ../master/i18n
      target: i18n
    - source: ../master/static
      target: static
    - source: ../master/assets
      target: assets
    - source: content
      target: content
    - source: ../master/content/site.md
      target: content/site.md
    - source: ../master/content/search.md
      target: content/search.md

